# Runs the UGV API sidecar alongside the Husarion simulation stack.
# Usage: docker compose -f src/ugv-api/compose.api-sim.yaml up api
name: ugv-api-sim

services:
  api:
    build: .
    image: ugv-api:sim
    container_name: ugv-api-sim
    network_mode: host
    ipc: host
    env_file: ../panther-autonomy-pkg/.env
    environment:
      - ROBOT_NAMESPACE=panther
    # Code mounted for live editing during development (no image rebuild needed).
    volumes:
      - ./bridge:/app/bridge
      - ./api:/app/api
    restart: unless-stopped